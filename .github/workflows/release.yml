name: Release

on:
  push:
    # PEP 440 final and pre-release versions only.
    tags:
    - v[0-9]+.[0-9]+.[0-9]+
    - v[0-9]+.[0-9]+.[0-9]+rc[0-9]+
    - v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+

permissions: {}

jobs:
  release-notes:
    name: Create release notes
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub release
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    # checkout can leave the tag lightweight (actions/checkout#882), dropping the release summary.
    - run: git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
    # tag_pattern matches only vX.Y.Z, so a pre-release such as v0.1.0rc1 gets its tag message as notes.
    - id: kind
      run: |
        if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
        else
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.md
        fi
    - uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff  # v4.9.1
      if: steps.kind.outputs.prerelease == 'false'
      with:
        version: v2.14.2  # same as the dev environment's git-cliff
        config: pyproject.toml
        args: --latest --strip all
      env:
        OUTPUT: release-notes.md
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file release-notes.md --prerelease="$PRERELEASE"
      env:
        GH_TOKEN: ${{ github.token }}
        PRERELEASE: ${{ steps.kind.outputs.prerelease }}

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0  # hatch-vcs reads tags for the version
        persist-credentials: false
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      with:
        enable-cache: false  # no cache poisoning in a publishing pipeline
    - run: uv build
    # Each distribution installs alone, imports, and carries the tag's version.
    - run: |
        for dist in dist/*.whl dist/*.tar.gz; do
          uv run --isolated --no-project --with "$dist" python -c \
            'import sys, sceua as w; assert w.__version__ == sys.argv[1], w.__version__' \
            "${GITHUB_REF_NAME#v}"
        done
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: dist
        path: dist/

  publish:
    name: Publish to PyPI
    needs: [build, release-notes]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sceua
    permissions:
      id-token: write  # trusted publishing and PEP 740 attestations
    steps:
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      with:
        enable-cache: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: dist
        path: dist/
    - uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a  # v0.0.7
    - run: uv publish
